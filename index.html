<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F7F4EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>凡尘问道</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#F7F4EC;--paper2:#EFEAE0;--paper3:#FBF9F3;
  --ink:#2C2C2A;--ink2:#5F5E5A;--ink3:#8A8578;
  --line:#DCD5C6;--line2:#C9C1AF;
  --green:#0F6E56;--green-l:#E1F5EE;
  --amber:#BA7517;--amber-l:#FAEEDA;
  --red:#993C1D;--red-l:#FAECE7;
  --blue:#185FA5;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.serif{font-family:"Songti SC","STSong","SimSun",Georgia,serif}
#app{
  position:relative;display:flex;flex-direction:column;
  height:100dvh;max-width:520px;margin:0 auto;background:var(--paper);
  overflow:hidden;
}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ---------- header ---------- */
#hdr{flex:none;background:var(--paper2);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 10px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hname{font-size:15px;font-weight:600;letter-spacing:.5px;color:var(--ink)}
.hrealm{font-size:12.5px;color:var(--green);font-weight:500}
.hbar{height:5px;border-radius:3px;background:#DCD5C6;margin-top:9px;overflow:hidden;position:relative}
.hbar>i{display:block;height:100%;width:0;background:var(--green);border-radius:3px;transition:width .35s ease}
.hbar.ready>i{background:linear-gradient(90deg,var(--amber),#D9A03C)}
.hmeta{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hmeta b{font-weight:500;color:var(--ink)}
.hmeta .warn{color:var(--red)}

/* ---------- view ---------- */
#view{flex:1;min-height:0;display:flex;flex-direction:column}
#view>div{flex:1;min-height:0}
#log{padding:14px 16px 6px}
.le{margin:0 0 10px;font-size:13.5px;line-height:1.85;color:var(--ink);
    animation:fin .28s ease both}
.le dim,.le.dim{color:var(--ink2)}
.le.good{color:var(--green)}
.le.bad{color:var(--red)}
.le.warn{color:var(--amber)}
.le.sys{color:var(--ink3);font-size:12.5px}
.le.break{color:var(--amber);font-weight:500}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
[data-tab]{display:none}
[data-tab].on{display:block}

/* ---------- actions ---------- */
#acts{flex:none;display:flex;gap:8px;padding:8px 14px 10px;border-top:1px solid var(--line);background:var(--paper)}
.btn{
  border:1px solid var(--line2);background:var(--paper3);color:var(--ink);
  border-radius:10px;padding:10px 4px;font-size:13px;text-align:center;
  cursor:pointer;user-select:none;transition:background .12s,transform .08s;
  font-family:inherit;flex:1;min-width:0;white-space:nowrap;
}
.btn:active{transform:scale(.975);background:#F2EEE2}
.btn.primary{background:var(--green);border-color:var(--green);color:#F7F4EC}
.btn.primary:active{background:#0B5A46}
.btn.gold{background:var(--amber);border-color:var(--amber);color:#FFFDF5}
.btn.gold:active{background:#9C6110}
.btn:disabled,.btn.off{opacity:.38;pointer-events:none}
.btn.sm{flex:none;padding:6px 12px;font-size:12.5px;border-radius:8px}

/* ---------- nav ---------- */
#nav{flex:none;display:flex;border-top:1px solid var(--line);background:var(--paper2);
     padding-bottom:env(safe-area-inset-bottom)}
#nav div{flex:1;text-align:center;padding:9px 0 10px;font-size:11.5px;color:var(--ink3);cursor:pointer;user-select:none}
#nav div.on{color:var(--green);font-weight:600}

/* ---------- panels ---------- */
.pad{padding:14px 16px 20px}
.card{background:var(--paper3);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.5px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed #E6E0D2;color:var(--ink2)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.kv .g{color:var(--green)}
.kv .r{color:var(--red)}
.kv .a{color:var(--amber)}
.hint{font-size:12px;color:var(--ink3);line-height:1.7;margin:6px 0 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #E6E0D2}
.row:last-child{border-bottom:0}
.row .nm{font-size:13px;color:var(--ink)}
.row .ds{font-size:11.5px;color:var(--ink3);margin-top:2px}
.row .rt{display:flex;align-items:center;gap:8px;flex:none}
.price{font-size:12px;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--paper2);color:var(--ink3);border:1px solid var(--line)}
.tag.eq{background:var(--green-l);color:var(--green);border-color:#B7DED0}
.tag.on{background:var(--amber-l);color:var(--amber);border-color:#EBCF9E}
.empty{text-align:center;color:var(--ink3);font-size:12.5px;padding:26px 0}

/* ---------- modal ---------- */
#mask{position:absolute;inset:0;background:rgba(44,44,42,.34);display:none;z-index:60}
#mask.on{display:block}
#modal{
  position:absolute;left:0;right:0;bottom:0;z-index:61;
  background:var(--paper);border-radius:18px 18px 0 0;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:86%;display:flex;flex-direction:column;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 24px rgba(44,44,42,.14);
}
#modal.on{transform:translateY(0)}
#modal .mh{flex:none;padding:16px 18px 0}
#modal .mh h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:.5px}
#modal .mb{padding:12px 18px 4px;overflow-y:auto;font-size:13.5px;line-height:1.85;color:var(--ink)}
#modal .mc{padding:8px 18px 6px;display:flex;flex-direction:column;gap:8px}

/* ---------- start ---------- */
#start{position:absolute;inset:0;z-index:80;background:var(--paper);display:flex;flex-direction:column;
       padding:calc(30px + env(safe-area-inset-top)) 24px 24px;overflow-y:auto}
#start.off{display:none}
.title{font-size:30px;letter-spacing:8px;color:var(--ink);text-align:center;margin:26px 0 6px;font-weight:400}
.subtitle{text-align:center;font-size:12px;color:var(--ink3);letter-spacing:3px;margin-bottom:34px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--ink3);margin-bottom:6px;letter-spacing:1px}
.field input{
  width:100%;padding:12px 14px;font-size:15px;font-family:inherit;
  background:var(--paper3);border:1px solid var(--line2);border-radius:10px;color:var(--ink);outline:none;
}
.field input:focus{border-color:var(--green)}
.rootbox{background:var(--paper3);border:1px solid var(--line2);border-radius:12px;padding:14px}
.rootbox .rn{font-size:15px;font-weight:600;color:var(--green);margin-bottom:4px}
.rootbox .rd{font-size:12px;color:var(--ink3);line-height:1.7}
.rootbox .rb{font-size:12px;color:var(--amber);margin-top:6px}
.startbtn{width:100%;padding:14px;border-radius:12px;background:var(--green);color:#F7F4EC;
          border:0;font-size:15px;font-family:inherit;letter-spacing:2px;cursor:pointer;margin-top:8px}
.startbtn:active{background:#0B5A46}
.startbtn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2);margin-top:10px;font-size:13px;letter-spacing:1px}
.foot{text-align:center;font-size:11px;color:var(--ink3);margin-top:auto;padding-top:24px;line-height:1.9}

/* ---------- 战斗（肉鸽式回合） ---------- */
#fight{position:absolute;inset:0;z-index:72;background:var(--paper);display:none;flex-direction:column;
       padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom))}
#fight.on{display:flex}
.ftop{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ftop .fn{font-size:15px;font-weight:600;letter-spacing:.5px}
.ftop .fr{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:5px;background:#DCD5C6;overflow:hidden;position:relative;flex:1}
.bar>i{display:block;height:100%;width:0;border-radius:5px;transition:width .28s ease}
.bar.hp>i{background:var(--green)}
.bar.foe>i{background:var(--red)}
.bar.mp>i{background:var(--blue)}
.bline{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);margin-top:7px}
.bline>span{width:26px;flex:none}
.bline b{font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink);min-width:66px;text-align:right;flex:none}
.foebox{flex:none;margin:12px 0 10px;background:var(--paper3);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.foebox .nm{font-size:14px;font-weight:600}
.foebox .sub{font-size:11.5px;color:var(--ink3);margin-top:2px}
.intent{margin-top:8px;font-size:12.5px;color:var(--amber);display:flex;align-items:center;gap:7px;line-height:1.4}
.intent .ic{width:21px;height:21px;border-radius:6px;background:var(--amber-l);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.flog{flex:1;min-height:0;overflow-y:auto;background:var(--paper2);border-radius:10px;padding:10px 12px;
      font-size:12.5px;line-height:1.75;color:var(--ink2);-webkit-overflow-scrolling:touch}
.flog p{margin:0 0 4px}
.flog .hit{color:var(--red)}
.flog .me{color:var(--green)}
.flog .sys{color:var(--ink3)}
.flog .big{color:var(--amber)}
.fbtns{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fbtn{border:1px solid var(--line2);background:var(--paper3);border-radius:10px;padding:11px 6px;text-align:center;
      cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);user-select:none}
.fbtn:active{transform:scale(.975);background:#F2EEE2}
.fbtn small{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px}
.fbtn.off{opacity:.38;pointer-events:none}
.fbtn.atk{border-color:#C9A0A0}
.fbtn.mag{border-color:#9FB4CE}
.fbtn.full{grid-column:1 / -1}
.fbtns.one{grid-template-columns:1fr}
.loot{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.lootc{border:1px solid var(--line2);background:var(--paper3);border-radius:10px;padding:11px 12px;cursor:pointer;
       text-align:left;font-family:inherit;width:100%}
.lootc:active{background:#F2EEE2}
.lootc .lt{font-size:13.5px;color:var(--ink)}
.lootc .ld{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ---------- 任务 ---------- */
.tcard{background:var(--paper3);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.tcard h3{margin:0 0 4px;font-size:13px;color:var(--amber);letter-spacing:.5px}
.tcard .td{font-size:12px;color:var(--ink3);line-height:1.7}
.step{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:4px 0;color:var(--ink3);line-height:1.6}
.step.done{color:var(--ink3);opacity:.55;text-decoration:line-through}
.step.cur{color:var(--ink);font-weight:500}
.step .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);margin-top:7px;flex:none}
.step.done .dot{background:var(--green)}
.step.cur .dot{background:var(--amber)}
/* ---------- 答题 ---------- */
.qwrap{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.qopt{text-align:left;padding:11px 12px;border:1px solid var(--line2);background:var(--paper3);border-radius:10px;
      font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.55;width:100%}
.qopt:active{background:#F2EEE2}
.qopt.right{background:var(--green-l);border-color:#B7DED0;color:var(--green)}
.qopt.wrong{background:var(--red-l);border-color:#E7B9A8;color:var(--red)}
.qopt.static{cursor:default}
/* ---------- 装备槽 ---------- */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px dashed var(--line2);border-radius:10px;padding:9px 6px;text-align:center;background:var(--paper2)}
.slot.has{border-style:solid;background:var(--paper3);cursor:pointer}
.slot .sn{font-size:10.5px;color:var(--ink3)}
.slot .sv{font-size:12px;color:var(--ink);margin-top:3px;line-height:1.4;min-height:17px}
.slot .sx{font-size:10.5px;color:var(--green);margin-top:2px}
.pwr{font-size:27px;font-weight:600;color:var(--amber);text-align:center;font-variant-numeric:tabular-nums;line-height:1.2}
.pwrsub{text-align:center;font-size:11px;color:var(--ink3);margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hrow">
      <span class="hname" id="h-name">—</span>
      <span class="hrealm" id="h-realm">—</span>
    </div>
    <div class="hbar" id="h-barw"><i id="h-bar"></i></div>
    <div class="hmeta">
      <span id="h-exp">修为 0 / 0</span>
      <span id="h-life">寿元 0 / 0</span>
      <span id="h-money">灵石 0</span>
      <span id="h-power">战力 0</span>
    </div>
  </header>

  <div id="view">
    <div class="scroll on" id="log" data-tab="cult"></div>
    <div class="scroll pad" id="tab-char" data-tab="char"></div>
    <div class="scroll pad" id="tab-bag" data-tab="bag"></div>
    <div class="scroll pad" id="tab-shop" data-tab="shop"></div>
    <div class="scroll pad" id="tab-world" data-tab="world"></div>
    <div class="scroll pad" id="tab-book" data-tab="book"></div>
  </div>

  <div id="acts">
    <button class="btn primary" id="a-train">打坐</button>
    <button class="btn" id="a-explore">游历</button>
    <button class="btn" id="a-fight">斗法</button>
    <button class="btn" id="a-break">突破</button>
  </div>

  <nav id="nav">
    <div class="on" data-go="cult">修炼</div>
    <div data-go="char">人物</div>
    <div data-go="bag">行囊</div>
    <div data-go="shop">坊市</div>
    <div data-go="world">世事</div>
    <div data-go="book">见闻</div>
  </nav>

  <div id="fight">
    <div class="ftop">
      <span class="fn" id="f-title">斗法</span>
      <span class="fr" id="f-round">第 1 回合</span>
    </div>
    <div style="margin-top:9px">
      <div class="bline"><span>气血</span><div class="bar hp"><i id="f-myhp"></i></div><b id="f-myhpt">0 / 0</b></div>
      <div class="bline"><span>灵力</span><div class="bar mp"><i id="f-mymp"></i></div><b id="f-mympt">0 / 0</b></div>
    </div>
    <div class="foebox">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <span class="nm" id="f-foename">—</span>
        <span class="sub" id="f-foepw">—</span>
      </div>
      <div class="bline"><span>气血</span><div class="bar foe"><i id="f-foehp"></i></div><b id="f-foehpt">0 / 0</b></div>
      <div class="intent"><span class="ic" id="f-iic">攻</span><span id="f-itext">—</span></div>
    </div>
    <div class="flog" id="f-log"></div>
    <div class="fbtns" id="f-btns"></div>
  </div>

  <div id="mask"></div>
  <div id="modal">
    <div class="mh"><h2 id="m-title"></h2></div>
    <div class="mb" id="m-body"></div>
    <div class="mc" id="m-choices"></div>
  </div>

  <div id="start">
    <div class="title serif" id="s-title">凡尘问道</div>
    <div class="subtitle">一介凡人的长生路</div>
    <div class="field">
      <label>道号</label>
      <input id="s-name" maxlength="8" placeholder="取个名字" autocomplete="off">
    </div>
    <div class="field">
      <label>先天灵根</label>
      <div class="rootbox" id="s-root"></div>
    </div>
    <button class="startbtn" id="s-go">踏入修行</button>
    <button class="startbtn ghost" id="s-reroll">换个灵根（剩 3 次）</button>
    <div class="foot">
      修为随时间自然累积 · 每 1.5 秒一日<br>
      存档保存在本机浏览器 · 换设备即新档<br>
      <span style="opacity:.6">v2.2 · 赌坊 · 装备 · 灵石</span>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   凡尘问道 —— 单文件文字修仙
   ============================================================ */

const SAVE_KEY = "fanchen_xiuxian_v1";
const TICK_MS = 1500;                 // 1.5 秒 = 游戏内 1 天
const DAYS_PER_YEAR = 360;
const OFFLINE_CAP_DAYS = 600;         // 离线最多折算 600 天
const OFFLINE_RATE = 0.5;
const IDLE_RATE = 0.5;             // 挂机（不点打坐）时的修炼效率

/* 打坐：真实时间冷却，一次抵 240 日苦修 */
const TRAIN_CD_MS   = 120000;      // 冷却 2 分钟（真实时间）
const TRAIN_BANK    = 3;           // 最多攒 3 次（离线也能攒）
const TRAIN_EXP_MUL = 6;   // 一次打坐 = 30 日 × 6 = 180 日修为
const EQUIP_STACK = 2;     // 每个部位可叠加穿戴几件（属性全部累加）

/* -------------------- 境界 -------------------- */
const REALMS = [
  {n:"练气", layers:13, base:110,      grow:1.32, life:50,   mul:1,     need:null},
  {n:"筑基", layers:4,  base:4000,     grow:1.55, life:160,  mul:5,     need:"zhujidan"},
  {n:"结丹", layers:4,  base:18000,    grow:1.55, life:320,  mul:20,    need:"jiedandan"},
  {n:"元婴", layers:4,  base:80000,    grow:1.55, life:600,  mul:70,    need:"yuanyingdan"},
  {n:"化神", layers:4,  base:360000,   grow:1.55, life:1000, mul:250,   need:"huashendan"},
  {n:"炼虚", layers:4,  base:1600000,  grow:1.55, life:1600, mul:800,   need:"lianxudan"},
  {n:"合体", layers:4,  base:7000000,  grow:1.55, life:2400, mul:2500,  need:"hetidan"},
  {n:"大乘", layers:4,  base:3e7,      grow:1.55, life:3600, mul:8000,  need:"dachengdan"},
  {n:"渡劫", layers:1,  base:1.3e8,    grow:1,    life:5000, mul:25000, need:"duojiedan"}
];
const SMALL_NAMES = ["初期","中期","后期","圆满"];
const NUM_CN = ["一","二","三","四","五","六","七","八","九","十","十一","十二","十三"];

function realmTitle(realm, layer){
  const r = REALMS[realm];
  if (!r) return "凡人";
  if (r.layers === 13) return r.n + NUM_CN[layer-1] + "层";
  return r.n + SMALL_NAMES[layer-1];
}

/* -------------------- 灵根 -------------------- */
const ROOTS = [
  {n:"伪灵根",   mul:0.75, w:26, d:"五行驳杂，灵气入体如泥牛入海。修行极慢，但胜在无人觊觎。"},
  {n:"三灵根",   mul:0.9,  w:26, d:"存三属性灵根，资质平平。凡人大抵如此，能走多远全看心性。"},
  {n:"双灵根",   mul:1.05, w:22, d:"两属相济，修行顺畅。放在小门派里已算良才。"},
  {n:"单灵根",   mul:1.35, w:16, d:"一属纯粹，灵气近乎无碍地汇入丹田。宗门争抢的对象。"},
  {n:"变异灵根", mul:1.75, w:7,  d:"雷、冰、风之类的异象之根。修行极快，但天妒英才，突破凶险。"},
  {n:"天灵根",   mul:2.3,  w:3,  d:"万年一遇。天地灵气自来投体，你只需静坐，便是他人一生所求。"}
];

/* -------------------- 品质 -------------------- */
const RARITY = [
  {n:"凡品", mul:1.0, c:"#8A8578"},
  {n:"良品", mul:1.7, c:"#3B6D11"},
  {n:"上品", mul:2.8, c:"#185FA5"},
  {n:"极品", mul:4.6, c:"#7F77DD"},
  {n:"灵品", mul:8.0, c:"#993C1D"}
];
const QDROP = {
  1:[.82,.16,.02,0,0],
  2:[.70,.24,.06,0,0],
  3:[.58,.29,.11,.02,0],
  4:[.46,.32,.17,.05,0],
  5:[.34,.33,.22,.09,.02],
  6:[.22,.30,.28,.15,.05],
  7:[.14,.24,.30,.22,.10]
};
function rollQ(lv){
  const t = QDROP[lv] || QDROP[1];
  let r = Math.random();
  for (let i=0;i<t.length;i++){ r -= t[i]; if (r <= 0) return i; }
  return 0;
}
const QKEY = (id,q) => id + "@" + (q|0);
function QID(k){ const i = k.indexOf("@"); return i < 0 ? k : k.slice(0,i); }
function QQ(k){ const i = k.indexOf("@"); return i < 0 ? 0 : (parseInt(k.slice(i+1),10)||0); }
function itemBase(k){ return ITEMS[QID(k)] || null; }
function itemName(k){
  const it = itemBase(k); if (!it) return "？";
  const q = QQ(k);
  return q > 0 ? it.n + "·" + RARITY[q].n : it.n;
}
function sellPrice(k){
  const it = itemBase(k); if (!it) return 0;
  return Math.round(it.price * RARITY[QQ(k)].mul * SELL_BOOST);
}
const SELL_BOOST = 3.2;   // 坊市回收价倍率（原版太低）

/* -------------------- 灵石收益：境界越高，来钱越容易 --------------------
   MONEY_K 按境界序号递增（练气 → 渡劫），再统一乘 MONEY_BOOST 让前期也不拮据。
   想改成严格「境界 1~9 对应倍率 1~9」，把 MONEY_K 换成 [1,2,3,4,5,6,7,8,9] 即可。 */
const MONEY_K     = [1, 3, 8, 18, 40, 90, 200, 450, 1000];
const MONEY_BOOST = 2.0;
function moneyK(){ return (MONEY_K[S.realm] || MONEY_K[0]) * MONEY_BOOST; }
function moneyGain(base){ return Math.round(base * moneyK()); }
function eqVal(k, field){
  const it = itemBase(k);
  return (it && it[field]) ? Math.round(it[field] * (1 + QQ(k)*0.45)) : 0;
}
function eqAtk(k){ return eqVal(k, "atk"); }
function eqDef(k){ return eqVal(k, "def"); }
function eqHp(k){ return eqVal(k, "hp"); }
function eqMp(k){ return eqVal(k, "mp"); }

/* -------------------- 属性计算 -------------------- */
function stats(){
  const r = REALMS[S.realm], li = S.layer;
  const mul = r.mul;
  const atkBase = Math.round(4 * mul * (1 + 0.18*(li-1)) * (1 + (S.physique-9)*0.02));
  const hpBase  = Math.round(40 * mul * (1 + 0.22*(li-1)) * (1 + (S.physique-9)*0.015));
  const eq = S.equip || {weapon:[], armor:[], trinket:[]};
  let w = 0, a = 0, hpE = 0, mpE = 0;
  ["weapon","armor","trinket"].forEach(sl=>{
    (eq[sl] || []).forEach(k=>{
      if (!S.bag[k]) return;
      w   += eqAtk(k);
      a   += eqDef(k);
      hpE += eqHp(k);
      mpE += eqMp(k);
    });
  });
  const atkAll = atkBase + w;
  const defAll = Math.round(atkAll * 0.35) + a;
  const hpMax  = hpBase + hpE;
  const mpMax  = 20 + S.realm*8 + S.insight*2 + mpE;
  return { atk: atkAll, baseAtk: atkBase, def: defAll, hpMax, mpMax, mul };
}

// 综合战力：攻伐、护体、气血、灵力、功法、灵根、悟性共同决定
function power(){
  const st = stats();
  const gf = GONGFA[S.gongfa] || GONGFA.changchun;
  const base = st.atk*1.0 + st.def*0.8 + st.hpMax*0.12 + st.mpMax*0.15;
  const realmK = 1 + S.realm*0.6;
  const rootK  = 1 + (S.rootMul - 1)*0.12;
  const mindK  = 1 + S.insight*0.004;
  return Math.round(base * realmK * rootK * mindK * (1 + (gf.pow||0)) * 10);
}
function mobPower(mob){
  return Math.round((mob.atk*1.0 + mob.def*0.8 + mob.hp*0.12) * (1 + (mob.lv||1)*0.35) * 10);
}

// 打坐次数（真实时间冷却，最多攒 TRAIN_BANK 次）
function medMax(){ return TRAIN_BANK; }
function refillTrain(){
  if (!S) return;
  if (typeof S.trainAt !== "number") S.trainAt = Date.now() + TRAIN_CD_MS;
  if (typeof S.med !== "number") S.med = TRAIN_BANK;
  const now = Date.now();
  if (S.med >= TRAIN_BANK){ if (S.trainAt < now) S.trainAt = now + TRAIN_CD_MS; return; }
  let guard = 0;
  while (S.med < TRAIN_BANK && now >= S.trainAt && guard++ < 20){
    S.med++;
    S.trainAt += TRAIN_CD_MS;
  }
  if (S.trainAt < now) S.trainAt = now;   // 离线太久不无限积压
}
function trainCdText(){
  const left = Math.max(0, (typeof S.trainAt === "number" ? S.trainAt : Date.now()) - Date.now());
  const sec = Math.ceil(left/1000);
  return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
}

function expNeed(){
  const r = REALMS[S.realm];
  return Math.floor(r.base * Math.pow(r.grow, S.layer - 1));
}

function gainPerDay(){
  const r = REALMS[S.realm];
  const g = GONGFA[S.gongfa].mul;
  const layerBoost = 1 + 0.3*(S.layer-1);
  const insight = 1 + (S.insight-9)*0.015;
  const wound = S.hurt > 0 ? 0.5 : 1;
  return 6 * r.mul * layerBoost * S.rootMul * g * insight * wound;
}

function lifeMax(){
  return REALMS[S.realm].life;
}

/* -------------------- 时间推进 -------------------- */
function advanceDays(n, mode){
  if (!S || S.dead) return;
  const idle = (mode === "idle");
  const rate = idle ? IDLE_RATE : 1;
  let gained = 0;
  for (let i=0;i<n;i++){
    S.day++;
    // 修为圆满时静坐入定，气机自锁，寿元不再损耗（仅限挂机）
    const frozen = idle && S.exp >= expNeed();
    if (!frozen) S.age += 1/DAYS_PER_YEAR;
    if (S.hurt > 0) S.hurt--;
    const g = gainPerDay() * rate;
    S.exp += g;
    gained += g;
    const st = stats();
    if (S.hp < st.hpMax) S.hp = Math.min(st.hpMax, S.hp + st.hpMax*0.02);
    if (S.age >= lifeMax()){ die(); return; }
    // 修炼状态下，小层瓶颈自动冲过（保留溢出修为）；大境界仍需玩家亲自出手
    if (mode !== "task" && S.hurt === 0){
      for (let k=0;k<3;k++){
        const rr = REALMS[S.realm];
        const need = expNeed();
        if (S.exp < need || S.layer >= rr.layers) break;
        S.exp -= need;
        S.layer++;
        S.hp = stats().hpMax;
        pushLog("气机一转，自然而然晋入 "+realmTitle(S.realm,S.layer)+"。", "sys");
      }
    }
    // 灵力恢复（打坐次数改由真实时间冷却，见 refillTrain）
    if (S.mp < st.mpMax && S.day % 6 === 0) S.mp = Math.min(st.mpMax, S.mp + 2);
    // 各种冷却
    if (S.quizCd > 0) S.quizCd--;
    if (S.sideCd > 0) S.sideCd--;
  }
  if (S.exp >= expNeed() && S.day - (S.flags.fullAt||-999) > 60){
    S.flags.fullAt = S.day;
    pushLog("修为早已圆满，你却还坐着。再坐下去只是空耗寿元。", "warn");
  }
  const yearsLeft = lifeMax() - S.age;
  if (yearsLeft < 6 && !S.flags.warn5){ S.flags.warn5 = 1; pushLog("你感到筋骨在衰败。寿元不足六年了。", "bad"); }
  if (yearsLeft < 2 && !S.flags.warn1){ S.flags.warn1 = 1; pushLog("夜里常常咳血。再不能突破，就要交代在这里了。", "bad"); }
  return gained;
}

function die(){
  S.dead = true;
  stopTick();
  openModal("寿元已尽",
    "你在蒲团上坐了很久。\n某日清晨，阳光移过窗棂，你没能再睁开眼。\n\n"+
    "享年 "+Math.floor(S.age)+" 岁，止步于 "+realmTitle(S.realm,S.layer)+"。\n"+
    "一生杀伐 "+S.stat.wins+" 场，走过 "+S.stat.explored+" 次远行。\n\n"+
    "自踏入修行到此刻，人间已过 "+fmt(S.day)+" 日（约 "+(S.day/DAYS_PER_YEAR).toFixed(1)+" 载）；"+
    "而你在这屏幕前，一共耗了 "+playTimeText()+"。",
    [{t:"重新开始", f:()=>{ hardReset(); }}]);
}

/* -------------------- 突破 -------------------- */
function breakRate(){
  const r = REALMS[S.realm];
  const isBig = S.layer >= r.layers;
  let base = isBig ? 0.52 : 0.88;
  base += S.insight * 0.004;
  base += (S.rootMul - 1) * 0.05;
  if (S.buff.pozhang) base += 0.25 * (typeof S.buff.pozhang === "number" ? S.buff.pozhang : 1);
  if (S.flags.bottleneck) base -= 0.1;
  return clamp(base, 0.08, 0.98);
}

function canBreak(){
  if (!S) return {ok:false, why:"..."};
  if (S.exp < expNeed()) return {ok:false, why:"修为未满"};
  if (S.hurt > 0) return {ok:false, why:"你身上有伤，需静养 "+S.hurt+" 日"};
  const r = REALMS[S.realm];
  const isBig = S.layer >= r.layers;
  if (isBig){
    const next = REALMS[S.realm+1];
    if (!next) return {ok:true, hasDan:true};
    if (!next.need) return {ok:true, hasDan:true};
    if (countOf(next.need) > 0) return {ok:true, hasDan:true};
    return {ok:true, hasDan:false, needDan:next.need};
  }
  return {ok:true, hasDan:true};
}

/* 渡劫成功 = 飞升，全局终局 */
function ascend(){
  bankPlay();
  S.ascended = true;
  S.dead = true;
  stopTick();
  save();
  showAscend();
}
function showAscend(){
  const years = (S.day / DAYS_PER_YEAR);
  openModal("白日飞升",
    "天劫压顶，你硬生生挨了九道。\n\n最后一道落下时，山门塌了半边，你还站着。\n\n" +
    "云端裂开一道缝，光落下来，把你整个人裹进去。\n\n" +
    S.name + "，自青石村一个凡人起家，一路走到渡劫。\n" +
    "享年 " + Math.floor(S.age) + " 岁 · 战力 " + fmt(power()) + "\n" +
    "斗法 " + S.stat.battles + " 场胜 " + S.stat.wins + " 场 · 远行 " + S.stat.explored + " 次\n\n" +
    "自踏入修行到此刻，人间已过 " + fmt(S.day) + " 日（约 " + years.toFixed(1) + " 载）；" +
    "而你在这屏幕前，一共耗了 " + playTimeText() + "。",
    [{t:"再开一世", f:()=>{ hardReset(); }}]);
}

function doBreak(){
  const chk = canBreak();
  if (!chk.ok){ pushLog("【不可突破】"+chk.why, "warn"); return; }
  const r = REALMS[S.realm];
  const isBig = S.layer >= r.layers;
  const isLast = S.realm >= REALMS.length - 1;
  const hasDan = chk.hasDan;
  let rate = breakRate();
  if (!hasDan) rate = rate * 0.5;
  const roll = Math.random();

  // 消耗丹药
  if (isBig && hasDan){
    const next = REALMS[S.realm+1];
    if (next && next.need){
      takeAny(next.need, 1);
    }
  }
  S.buff.pozhang = false;
  advanceDays(isBig ? RI(60,120) : RI(10,30), "train");
  if (S.dead) return;

  if (roll < rate){
    S.stat.breaks++;
    if (isBig){
      if (isLast){ ascend(); return; }
      S.exp -= expNeed();
      S.realm++;
      S.layer = 1;
      if (S.exp < 0) S.exp = 0;
      const st = stats();
      S.hp = st.hpMax;
      pushLog("天地灵气如潮涌入，你周身骨骼爆响。", "good");
      pushLog("【突破】你已踏入 "+realmTitle(S.realm,S.layer)+"！寿元上限增至 "+lifeMax()+" 岁。", "break");
      flashModal("境界已破", "你踏入 "+realmTitle(S.realm,S.layer)+"。\n寿元上限 "+lifeMax()+" 岁，可去更远处看看了。");
    } else {
      S.exp -= expNeed();
      S.layer++;
      if (S.exp < 0) S.exp = 0;
      const st = stats();
      S.hp = st.hpMax;
      pushLog("【突破】修为大进，晋入 "+realmTitle(S.realm,S.layer)+"。", "good");
    }
  } else {
    S.stat.fails++;
    S.exp = Math.floor(S.exp * 0.65);
    const st = stats();
    S.hp = Math.max(1, Math.round(st.hpMax*0.5));
    S.hurt = isBig ? RI(30,60) : RI(6,15);
    pushLog("【失败】气机逆乱，一股血气冲上喉头。你吐出一口血。", "bad");
    pushLog("修为散了三成，需静养 "+S.hurt+" 日。", "bad");
    if (Math.random() < 0.25){
      S.insight = Math.min(30, S.insight+1);
      pushLog("痛定思痛，你隐约摸到了一点门槛。（悟性 +1）", "sys");
    }
  }
  // 破境后真元与灵力补满，并顺手看看下一境的丹是否要寻
  S.med = medMax();
  S.mp = stats().mpMax;
  S.hurt = 0;
  save(); renderHeader(); renderTab();
  if (!S.task) setTimeout(()=>{ checkDanQuest(false); }, 900);
}

/* -------------------- 战斗 -------------------- */
function makeMob(lv){
  const pool = MOBS[lv] || MOBS[1];
  const m = pick(pool);
  const jitter = R(0.92, 1.1);
  const hp = Math.round(m[1]*jitter);
  const atk = Math.round(m[2]*jitter);
  return {
    n: m[0],
    hp: hp,
    hpMax: hp,
    atk: atk,
    def: Math.round(atk*0.3),
    lv
  };
}

/* 自适应对手：只在你明显不济时回调，免得强制差事把人卡死；
   你若已够强，则原样不动，装备与境界照常算数。 */
function makeFoe(lv){
  const m = makeMob(lv);
  const st = stats();
  const pDmg = Math.max(1, st.atk*1.2 - m.def*0.5);
  if (m.hp / pDmg > 12) m.hp = Math.round(pDmg * RI(9,11));
  const eDmg = Math.max(1, m.atk - st.def*0.5);
  // 带伤上阵时按当前气血折算，免得必死
  const effHp = Math.max(1, Math.min(S.hp, st.hpMax));
  if (effHp / eDmg < 12){
    m.atk = Math.round(effHp / RI(12,15) + st.def*0.5);
    m.def = Math.round(m.atk*0.3);
  }
  m.hpMax = m.hp;
  return m;
}

function battle(mob, opt){
  opt = opt || {};
  const st = stats();
  let myHp = S.hp;
  let foeHp = mob.hp;
  const lines = [];
  let rounds = 0;
  const maxRounds = opt.maxRounds || 22;

  // 自动结算按「正常发挥」估算：含术法与守势的收益
  const AUTO_ATK = 1.2, AUTO_DEF = 0.9;
  while (myHp > 0 && foeHp > 0 && rounds < maxRounds){
    rounds++;
    let dmg = Math.max(1, Math.round((st.atk*AUTO_ATK - mob.def*0.5) * R(0.88,1.12)));
    if (opt.power) dmg = Math.round(dmg * opt.power);
    foeHp -= dmg;
    if (foeHp <= 0) break;
    const edmg = Math.max(1, Math.round((mob.atk - st.def*0.5) * AUTO_DEF * R(0.88,1.12)));
    myHp -= edmg;
  }

  const win = foeHp <= 0 && myHp > 0;
  S.stat.battles++;
  if (win) S.stat.wins++;

  if (win){
    S.hp = Math.max(1, Math.round(myHp));
    const money = moneyGain(mob.lv * RI(14,26) * R(0.9,1.25));
    const exp = Math.round(gainPerDay() * RI(6,14) * (1 + mob.lv*0.15));
    S.money += money;
    S.exp = Math.min(expNeed(), S.exp + exp);
    let extra = "";
    const dropN = Math.random() < 0.5 ? (Math.random() < 0.25 ? 2 : 1) : 0;
    if (dropN > 0){
      const drops = {
        1:["shoupi","lingcao","fuzhi"], 2:["shoupi","lingcao","yaodan","xueteng"],
        3:["lingcao","yaodan","yaogu","xueteng"], 4:["yaodan","lingshi_ore","yaogu","xueteng"],
        5:["yaodan","lingshi_ore","lingyu"], 6:["yaodan","lingshi_ore","lingyu"],
        7:["yaodan","lingshi_ore","lingyu"]
      };
      const d = pick(drops[mob.lv] || ["lingcao"]);
      const q = rollQ(mob.lv);
      const k = addItem(d, dropN, q);
      extra = "\n拾得 "+itemName(k)+" ×"+dropN+"。";
      if (q >= 3) extra += "（好东西，坊市肯出高价）";
    }
    // 打野也有机会直接掉装备
    if (Math.random() < 0.16 + mob.lv*0.015){
      const ek = rollEquip(mob.lv);
      extra += "\n尸身上还挂着件东西——"+itemName(ek)+"。";
    }
    return {
      win:true,
      text: "你与"+mob.n+"缠斗了约 "+rounds+" 回合。\n剑光过处，"+mob.n+"闷吼一声栽倒。\n\n"+
            "得灵石 "+money+"，修为 +"+fmt(exp)+"。"+extra,
      rounds
    };
  } else {
    S.hp = Math.max(1, Math.round(st.hpMax*0.15));
    S.hurt = Math.max(S.hurt, RI(2,6));
    return {
      win:false,
      text: "你与"+mob.n+"缠斗了约 "+rounds+" 回合。\n气血翻涌，你脚步一乱，被它撞在胸口。\n\n"+
            "你勉强退走，伤得不轻，需静养 "+S.hurt+" 日。",
      rounds
    };
  }
}

/* ============================================================
   肉鸽式回合斗法
   每回合先看对手「意图」，再从 猛攻 / 守势 / 术法 / 遁走 中选一手。
   胜后进入战利品三选一。
   ============================================================ */
let B = null;
const INTENTS = [
  {k:"atk",   ic:"攻", n:"扑击",     mult:1.00, d:"一次寻常的扑击"},
  {k:"heavy", ic:"重", n:"蓄力重击", mult:1.90, d:"它沉腰蓄势，下一击势大力沉"},
  {k:"cast",  ic:"术", n:"施展术法", mult:1.32, d:"术法自侧面袭来，难以尽挡"},
  {k:"guard", ic:"守", n:"凝神守御", mult:0.50, d:"它收紧护体之气，攻势不显"}
];

function rollIntent(){
  const w = [["atk",44],["heavy",19],["cast",23],["guard",14]];
  let t = 0; w.forEach(x=>t+=x[1]);
  let r = Math.random()*t, k = "atk";
  for (const x of w){ r -= x[1]; if (r <= 0){ k = x[0]; break; } }
  const it = INTENTS.find(i=>i.k===k);
  // 数值在意图里抖动，让「重击」不至于每回合都一样疼
  return {k:it.k, ic:it.ic, n:it.n, d:it.d, mult:it.mult * R(0.92,1.08)};
}

function openFight(mob, onEnd){
  if (!S || S.dead) return;
  const st = stats();
  S.hp = Math.min(Math.max(1, S.hp), st.hpMax);
  B = {
    mob: mob,
    st: st,
    myHp: Math.round(S.hp),
    myMp: Math.min(S.mp, st.mpMax),
    foeHp: mob.hp,
    guard: false,
    round: 0,
    intent: rollIntent(),
    over: false,
    fled: false,
    onEnd: onEnd || null
  };
  $("f-title").textContent = "斗法 · " + mob.n;
  $("f-foename").textContent = mob.n;
  $("f-foepw").textContent = "战力 " + fmt(mobPower(mob));
  $("f-log").innerHTML = "";
  flog("你与" + mob.n + "对峙。敌手战力 " + fmt(mobPower(mob)) + "，你是 " + fmt(power()) + "。", "sys");
  renderFight();
  $("fight").classList.add("on");
  stopTick();
}

function flog(text, cls){
  const p = document.createElement("p");
  if (cls) p.className = cls;
  p.textContent = text;
  const box = $("f-log");
  box.appendChild(p);
  box.scrollTop = box.scrollHeight;
}

function renderFight(){
  if (!B) return;
  const st = B.st;
  $("f-round").textContent = "第 " + (B.round+1) + " 回合";
  $("f-myhp").style.width = clamp(B.myHp/st.hpMax*100, 0, 100) + "%";
  $("f-myhpt").textContent = Math.max(0,Math.round(B.myHp)) + " / " + st.hpMax;
  $("f-mymp").style.width = clamp(B.myMp/st.mpMax*100, 0, 100) + "%";
  $("f-mympt").textContent = Math.round(B.myMp) + " / " + st.mpMax;
  $("f-foehp").style.width = clamp(B.foeHp/B.mob.hp*100, 0, 100) + "%";
  $("f-foehpt").textContent = Math.max(0,Math.round(B.foeHp)) + " / " + B.mob.hp;
  $("f-iic").textContent = B.intent.ic;
  $("f-itext").textContent = "下一手：" + B.intent.n + " — " + B.intent.d;

  const box = $("f-btns");
  box.innerHTML = "";
  const mk = (label, sub, cls, fn)=>{
    const b = document.createElement("button");
    b.className = "fbtn " + (cls||"") + (fn ? "" : " off");
    b.innerHTML = label + (sub ? "<small>"+sub+"</small>" : "");
    if (fn) b.onclick = fn;
    box.appendChild(b);
    return b;
  };
  if (B.over) return;
  const cost = 14;
  const canCast = B.myMp >= cost;
  const p1 = power(), p2 = mobPower(B.mob);
  const fleeP = Math.round(clamp(0.28 + (p1 - p2)/Math.max(1,p1)*0.55, 0.15, 0.88) * 100);
  mk("猛攻", "全力一击 · 伤害 100%", "atk", ()=>fightAct("atk"));
  mk("守势", "减伤 60% · 回灵力 11", "", ()=>fightAct("guard"));
  mk("术法", canCast ? ("耗灵力 " + cost + " · 伤害 190%") : ("灵力不足 " + Math.round(B.myMp) + " / " + cost),
     "mag", canCast ? ()=>fightAct("cast") : null);
  mk("遁走", "约 " + fleeP + "% 能脱身", "", ()=>fightAct("flee"));
  const hq = countOf("huiqi");
  if (hq > 0) mk("服回气丹", "还有 " + hq + " 枚 · 回气血", "full", ()=>fightAct("pill"));
}

function fightAct(kind){
  if (!B || B.over) return;
  const st = B.st;
  B.guard = false;
  let extra = "";

  if (kind === "pill"){
    const key = Object.keys(S.bag).filter(x=>QID(x)==="huiqi").sort((a,b)=>QQ(a)-QQ(b))[0];
    if (!key) return;
    removeItem(key, 1);
    const v = Math.round(st.hpMax*0.42);
    B.myHp = Math.min(st.hpMax, B.myHp + v);
    flog("你摸出一枚回气丹吞下，气血 +" + v + "。", "me");
  } else if (kind === "atk"){
    const crit = Math.random() < 0.12;
    const d = Math.max(1, Math.round((st.atk - B.mob.def*0.5) * (crit?1.75:1.0) * R(0.9,1.1)));
    B.foeHp -= d;
    flog("你欺身而上，" + (crit?"正中要害！":"") + "伤它 " + d + "。", "me" + (crit?"":""));
    if (crit) { const p = $("f-log").lastChild; if (p) p.className = "me big"; }
  } else if (kind === "guard"){
    B.guard = true;
    const d = Math.max(1, Math.round((st.atk - B.mob.def*0.5) * 0.55 * R(0.9,1.1)));
    B.foeHp -= d;
    B.myMp = Math.min(st.mpMax, B.myMp + 11);
    flog("你收势护住周身，只递出 " + d + " 点伤害，灵力回了些。", "me");
  } else if (kind === "cast"){
    const cost = 14;
    if (B.myMp < cost){
      flog("灵力不够，术法没能成形。", "sys");
      renderFight();
      return;
    }
    B.myMp -= cost;
    const d = Math.max(1, Math.round((st.atk*1.9 - B.mob.def*0.2) * R(0.9,1.1)));
    B.foeHp -= d;
    flog("你掐诀成术，一道灵光劈下，伤它 " + d + "。", "me big");
  } else if (kind === "flee"){
    const p1 = power(), p2 = mobPower(B.mob);
    const chance = clamp(0.28 + (p1 - p2)/Math.max(1,p1)*0.55, 0.15, 0.88);
    if (Math.random() < chance){
      B.over = true; B.fled = true;
      flog("你虚晃一招，纵身退开，头也不回。", "sys");
      return finishFight();
    }
    flog("它早有防备，退路被封死了。", "sys");
  }

  B.myMp = Math.min(st.mpMax, B.myMp + 3);

  if (B.foeHp <= 0){
    B.over = true;
    flog(B.mob.n + "闷吼一声，栽倒在地。", "me");
    return finishFight();
  }

  // ---- 对手出手 ----
  B.round++;
  const im = B.intent;
  let ed = Math.max(1, Math.round((B.mob.atk*im.mult - st.def*0.5) * R(0.9,1.1)));
  if (B.guard) ed = Math.max(1, Math.round(ed*0.4));
  if (im.k === "cast" && B.myMp > 0){
    const drain = Math.min(B.myMp, Math.round(6 + B.mob.lv*1.5));
    B.myMp -= drain;
    extra = "，灵力被搅去 " + drain;
  }
  if (im.k === "guard") B.foeHeal = true;
  B.myHp -= ed;
  flog(B.mob.n + im.n + "，你受 " + ed + " 点伤" + extra + (B.guard?"（守住了大半）":"") + "。", "hit");

  B.intent = rollIntent();

  if (B.myHp <= 0){
    B.over = true;
    flog("眼前一黑，你拼尽最后一口气遁走。", "hit");
    return finishFight();
  }
  renderFight();
}

function finishFight(){
  const st = B.st;
  const win = B.foeHp <= 0 && B.myHp > 0;
  const fled = B.fled;
  S.stat.battles++;
  if (win) S.stat.wins++;
  S.mp = Math.max(0, Math.round(B.myMp));
  const cb = B.onEnd;

  if (win){
    S.hp = Math.max(1, Math.round(B.myHp));
    if (S.side && S.side.taken) S.side.wins = (S.side.wins||0) + 1;
    showLoot(cb);
  } else {
    S.hp = Math.max(1, Math.round(st.hpMax*0.15));
    S.hurt = Math.max(S.hurt, RI(2,6));
    if (fled) pushLog("你从" + B.mob.n + "手里逃了出来，狼狈得很，什么也没捞着。", "warn");
    else pushLog("你败给" + B.mob.n + "，伤得不轻，需静养 " + S.hurt + " 日。", "bad");
    closeFight();
    if (cb) cb(false);
  }
  save(); renderHeader(); renderTab();
}

function showLoot(cb){
  const lv = B.mob.lv;
  const money = moneyGain(lv * RI(28,52) * R(0.9,1.3) * (1 + lv*0.25));
  const exp   = Math.round(gainPerDay() * RI(8,16) * (1 + lv*0.22));
  const opts = [];
  opts.push({t:"灵石 ×" + fmt(money), d:"实实在在的好处", f:()=>{ S.money += money; return "得灵石 " + money + "。"; }});
  opts.push({t:"修为 ×" + fmt(exp),   d:"这一战的心得",   f:()=>{ S.exp += exp; return "修为 +" + fmt(exp) + "。"; }});

function closeFight(){
  B = null;

  if (S && !S.dead) startTick();
}

/* -------------------- 物品 -------------------- */
function addItem(id, n, q){
  q = q || 0;
  const k = QKEY(id, q);
  S.bag[k] = (S.bag[k]||0) + n;
  return k;
}
function removeItem(key, n){
  if (!S.bag[key]) return false;
  S.bag[key] -= n;
  if (S.bag[key] <= 0) delete S.bag[key];
  return true;
}
// 按物品 id 合计所有品质的数量
function countOf(id){
  let t = 0;
  for (const k in S.bag){ if (QID(k) === id) t += S.bag[k]; }
  return t;
}
// 跨品质取出 n 个（先取低品质）
function takeAny(id, n){
  const keys = Object.keys(S.bag).filter(k=>QID(k)===id).sort((a,b)=>QQ(a)-QQ(b));
  let left = n;
  for (const k of keys){
    if (left <= 0) break;
    const use = Math.min(S.bag[k], left);
    removeItem(k, use);
    left -= use;
  }
  return left === 0;
}

function drawEvent(){
  const total = EVENTS.reduce((a,e)=>a+e.w, 0);
  let r = Math.random()*total;
  for (const e of EVENTS){
    r -= e.w;
    if (r <= 0) return e.gen();
  }
  return EVENTS[0].gen();
}

/* -------------------- 模态框 -------------------- */
function openModal(title, body, choices){
  $("m-title").textContent = title;
  $("m-body").innerHTML = "";
  body.split("\n").forEach(line=>{
    const p = document.createElement("p");
    p.style.margin = "0 0 6px";
    p.textContent = line;
    $("m-body").appendChild(p);
  });
  const cbox = $("m-choices");
  cbox.innerHTML = "";
  (choices||[{t:"知道了", f:null}]).forEach((c,i)=>{
    const b = document.createElement("button");
    b.className = "btn" + (i===0 ? " primary" : "");
    b.style.padding = "12px";
    b.textContent = c.t;
    b.onclick = ()=>{
      closeModal();
      if (c.f){
        const res = c.f();
        if (res) pushLog(res);
      }
      save(); renderHeader(); renderTab();
    };
    cbox.appendChild(b);
  });
  modalOpen = true;
  $("mask").classList.add("on");
  $("modal").classList.add("on");
}

function flashModal(title, body){
  openModal(title, body, [{t:"好", f:null}]);
}

function closeModal(){
  modalOpen = false;
  $("mask").classList.remove("on");
  $("modal").classList.remove("on");
}

/* 支持 HTML 正文的模态框（任务卡、答题等） */
function openHtml(title, html, choices){
  $("m-title").textContent = title;
  $("m-body").innerHTML = html;
  const cbox = $("m-choices");
  cbox.innerHTML = "";
  (choices||[{t:"知道了", f:null}]).forEach((c,i)=>{
    const b = document.createElement("button");
    b.className = "btn" + (i===0 ? " primary" : "");
    b.style.padding = "12px";
    b.textContent = c.t;
    b.onclick = ()=>{
      closeModal();
      if (c.f){ const res = c.f(); if (res) pushLog(res); }
      save(); renderHeader(); renderTab();
    };
    cbox.appendChild(b);
  });
  modalOpen = true;
  $("mask").classList.add("on");
  $("modal").classList.add("on");
}

/* ============================================================
   主线剧情
   ============================================================ */
function storyReady(s){
  if (S.story.indexOf(s.id) >= 0) return false;
  if (S.realm > s.need.r) return true;
  if (S.realm === s.need.r && S.layer >= s.need.l) return true;
  return false;
}
function nextStory(){
  for (const s of STORY){ if (storyReady(s)) return s; }
  return null;
}
function runStory(s){
  const choices = s.opts.map(o=>({
    t:o.t,
    f:()=>{ S.story.push(s.id); S.pendingStory = null; return o.f(); }
  }));
  openModal(s.title, s.text, choices);
}
function checkStory(){
  if (!S || S.dead || modalOpen || B) return false;
  if (S.task) return false;
  const s = nextStory();
  if (!s) return false;
  if (S.pendingStory === s.id) return false;
  S.pendingStory = s.id;
  runStory(s);
  return true;
}
function resumeStory(){
  const s = STORY.filter(x=>x.id === S.pendingStory)[0];
  if (!s){ flashModal("无甚可续", "此刻没有悬着的章节。"); return; }
  runStory(s);
}

/* ============================================================
   强制寻丹差事（第一优先级）
   ============================================================ */
function nextRealmPill(){
  const nx = REALMS[S.realm+1];
  return (nx && nx.need) ? nx.need : null;
}
function checkDanQuest(force){
  if (!S || S.dead || S.task || B) return false;
  const r = REALMS[S.realm];
  if (S.layer < r.layers) return false;
  const id = nextRealmPill();
  if (!id || !DAN_QUEST[id]) return false;
  if (countOf(id) > 0) return false;
  if (!force && S.exp < expNeed()) return false;
  return startDanQuest(id);
}
function startDanQuest(id){
  const dq = DAN_QUEST[id];
  if (!dq) return false;
  S.task = { kind:"dan", id:id, step:0 };
  pushLog("【强制差事】" + dq.n + " —— 此事未了，别的一概放下。", "warn");
  save();
  openHtml("接下了差事", taskHtml(), [
    {t:"即刻动身", f:()=>{ advanceTask(); }},
    {t:"先看看别处", f:null}
  ]);
  return true;
}
function taskHtml(){
  const t = S.task;
  if (!t) return "";
  const dq = DAN_QUEST[t.id];
  let h = "<p class='td'>目标：" + ITEMS[t.id].n + " 一枚。这是<b>第一要务</b>，期间打坐、游历、斗法、突破都做不得。</p><div style='margin-top:6px'>";
  dq.steps.forEach((s,i)=>{
    const cls = i < t.step ? "done" : (i === t.step ? "cur" : "");
    let tail = "";
    if (i === t.step){
      if (s.days) tail += "（约 " + s.days[0] + "-" + s.days[1] + " 日）";
      if (s.item) tail += "（需 " + ITEMS[s.item.id].n + " ×" + s.item.n + "，你有 " + countOf(s.item.id) + "）";
      if (s.battle) tail += "（需胜一场）";
    }
    h += "<div class='step " + cls + "'><span class='dot'></span><span>" + s.t + tail + "</span></div>";
  });
  return h + "</div>";
}
function advanceTask(){
  const t = S.task;
  if (!t) return;
  const dq = DAN_QUEST[t.id];
  const step = dq.steps[t.step];
  if (!step){ afterStep(); return; }
  if (step.item && countOf(step.item.id) < step.item.n){
    const lack = step.item.n - countOf(step.item.id);
    const d2 = RI((step.days?step.days[0]:6)*2, (step.days?step.days[1]:12)*3);
    openHtml("还差材料",
      "<p class='td'>" + step.t + "</p>"
      + "<p>需要 <b>" + ITEMS[step.item.id].n + " ×" + step.item.n + "</b>，你手上只有 " + countOf(step.item.id) + " 个，还差 <b>" + lack + "</b> 个。</p>"
      + "<p class='hint'>可以去坊市的「材料」一栏买；也可以自己在山里寻，只是要多费些时日。</p>",
      [
        {t:"就地采集（约 " + d2 + " 日）", f:()=>{
          advanceDays(d2, "task");
          addItem(step.item.id, lack, 0);
          pushLog("你多花了 " + d2 + " 日，在山里凑齐了 " + ITEMS[step.item.id].n + " ×" + lack + "。", "sys");
          save(); renderHeader(); renderTab();
          return null;
        }},
        {t:"先去坊市买", f:null}
      ]);
    return;
  }
  if (step.battle){
    setTimeout(()=>{
      openFight(makeFoe(step.battle), (win)=>{
        if (win){ t.step++; afterStep(); }
        else { setTimeout(()=>flashModal("败了", "你没能挡住。\n\n这一关还得再来一次。"), 280); }
        save(); renderTab();
      });
    }, 240);
    return;
  }
  if (step.item) takeAny(step.item.id, step.item.n);
  const days = RI(step.days[0], step.days[1]);
  advanceDays(days, "task");
  pushLog("· " + step.t + "（过了 " + days + " 日）", "dim");
  t.step++;
  afterStep();
}
function afterStep(){
  const t = S.task;
  if (!t) return;
  const dq = DAN_QUEST[t.id];
  save(); renderHeader(); renderTab();
  if (t.step >= dq.steps.length){
    addItem(t.id, 1, 0);
    S.task = null;
    S.med = medMax();
    pushLog("丹成。你捧着那枚" + ITEMS[t.id].n + "，手心发烫。", "break");
    flashModal("丹成", "炉盖掀开，一股药香扑面。\n\n" + ITEMS[t.id].n + "到手了。\n\n打坐次数已补满，去冲境吧。");
  } else {
    openHtml(dq.n, taskHtml(), [
      {t:"继续赶路", f:()=>{ advanceTask(); }},
      {t:"暂歇片刻", f:null}
    ]);
  }
}
function taskBlocked(){
  const t = S.task;
  if (!t) return;
  const dq = DAN_QUEST[t.id];
  openHtml("差事未了",
    "<p class='td'><b>" + dq.n + "</b> —— 第一要务，别的事一概做不得。</p>" + taskHtml(),
    [{t:"继续赶路", f:()=>{ advanceTask(); }}, {t:"先歇一歇", f:null}]);
}

/* ============================================================
   支线差事
   ============================================================ */
function rollSide(){
  const t = pick(SIDE_TASKS);
  S.side = { n:t.n, d:t.d, need:t.need, reward:t.reward, taken:false, wins:0 };
}
function takeSide(){
  const t = S.side;
  if (!t || t.taken) return;
  t.taken = true;
  t.startDay = S.day;
  t.daysNeed = t.need.days ? RI(t.need.days[0], t.need.days[1]) : 0;
  t.wins = 0;
  pushLog("你接下了「" + t.n + "」。", "sys");
  save(); renderTab();
}
function sideProgress(t){
  if (!t) return "";
  const p = [];
  if (t.need.days)   p.push("时日 " + Math.min(S.day - (t.startDay||0), t.daysNeed) + " / " + t.daysNeed);
  if (t.need.item)   p.push(ITEMS[t.need.item].n + " " + countOf(t.need.item) + " / " + t.need.n);
  if (t.need.battle) p.push("胜 " + (t.wins||0) + " / " + t.need.battle);
  return p.join(" · ");
}
function sideReady(t){
  if (!t || !t.taken) return false;
  if (t.need.days   && (S.day - t.startDay) < t.daysNeed) return false;
  if (t.need.item   && countOf(t.need.item) < t.need.n)   return false;
  if (t.need.battle && (t.wins||0) < t.need.battle)       return false;
  return true;
}
function deliverSide(){
  const t = S.side;
  if (!t || !t.taken || !sideReady(t)) return;
  if (t.need.item) takeAny(t.need.item, t.need.n);
  const pay = moneyGain(RI(t.reward.money[0], t.reward.money[1]));
  S.money += pay;
  S.rep += t.reward.rep;
  pushLog("「" + t.n + "」了结，得灵石 " + pay + "，声望 +" + t.reward.rep + "。", "good");
  S.side = null;
  S.sideCd = 6;
  save(); renderHeader(); renderTab();
}
function dropSide(){
  if (!S.side) return;
  pushLog("你把「" + S.side.n + "」推了。", "dim");
  S.side = null;
  S.sideCd = 10;
  save(); renderTab();
}

/* ============================================================
   打坐悟道（凡人修仙传问答）
   ============================================================ */
let QUIZ_CUR = null;
function openQuiz(){
  if (!S || S.dead) return;
  if (S.quizCd > 0){
    flashModal("心神未定", "刚参悟过一场，还需静一静。\n\n再过 " + S.quizCd + " 日可再参悟。");
    return;
  }
  const q = pick(QUIZ);
  const right = q.a[q.ok];
  const opts = shuffle(q.a);
  const okIdx = opts.indexOf(right);
  const gain = Math.round(gainPerDay() * RI(26,58));
  const loss = Math.round(gainPerDay() * RI(14,34));
  QUIZ_CUR = {q:q.q, opts:opts, ok:okIdx, gain:gain, loss:loss};

  const head = "<p style='font-size:14px;line-height:1.9'>" + escapeHtml(q.q) + "</p>"
             + "<p class='hint'>答对：修为 +" + fmt(gain) + " · 答错：修为 −" + fmt(loss) + "</p>"
             + "<div class='qwrap'>";
  let body = head;
  opts.forEach((t,i)=>{ body += "<div class='qopt static'>" + escapeHtml(t) + "</div>"; });
  body += "</div>";

  const choices = opts.map((t,i)=>({
    t:t,
    f:()=>{
      S.quizCd = 14;
      const q2 = QUIZ_CUR;
      if (i === q2.ok){
        S.exp += q2.gain;
        S.quizRight++;
        if (Math.random() < 0.22) S.insight = Math.min(30, S.insight+1);
        pushLog("参悟：答对。「" + q2.opts[q2.ok] + "」修为 +" + fmt(q2.gain) + "。", "good");
        quizResult(i, "对。你把多年见闻串成一线，心下豁然。\n\n修为 +" + fmt(q2.gain) + "。");
      } else {
        S.exp = Math.max(0, S.exp - q2.loss);
        S.quizWrong++;
        pushLog("参悟：答错。正确答案是「" + q2.opts[q2.ok] + "」。修为 −" + fmt(q2.loss) + "。", "bad");
        quizResult(i, "错。你想岔了，气机也跟着散了些。\n\n正确答案是「" + q2.opts[q2.ok] + "」。\n\n修为 −" + fmt(q2.loss) + "。");
      }
      save(); renderHeader(); renderTab();
      return null;
    }
  }));
  openHtml("道心之问", body, choices);
}
function quizResult(chose, tail){
  const q2 = QUIZ_CUR;
  if (!q2) return;
  let h = "<p style='font-size:14px;line-height:1.9'>" + escapeHtml(q2.q) + "</p><div class='qwrap'>";
  q2.opts.forEach((t,i)=>{
    const cls = (i === q2.ok) ? " right" : (i === chose ? " wrong" : "");
    h += "<div class='qopt static" + cls + "'>" + escapeHtml(t) + "</div>";
  });
  h += "</div><p style='margin-top:10px;white-space:pre-wrap;line-height:1.85'>" + escapeHtml(tail) + "</p>";
  openHtml(chose === q2.ok ? "参透了" : "想岔了", h, [{t:"收功", f:null}]);
}

/* -------------------- 主循环 -------------------- */
function startTick(){
  if (timer) clearInterval(timer);
  timer = setInterval(()=>{
    if (!S || S.dead || modalOpen || B) return;
    advanceDays(1, "idle");
    renderHeader();
    refillTrain();
    // 支线刷新
    if (!S.side && S.sideCd <= 0){ rollSide(); if (currentTab==="world") renderWorld(); }
    // 强制寻丹差事：第一优先级
    if (checkDanQuest(false)) return;
    // 主线章节
    checkStory();
  }, TICK_MS);
}
function stopTick(){
  if (timer){ clearInterval(timer); timer = null; }
}

/* -------------------- 存档 -------------------- */
let WIPED = false;   // 点了「重开」后置位，阻止 beforeunload / 定时保存把旧档写回去
let sessionStart = Date.now();

/* 累计真实游玩时长（只算页面开着的时间，离线不算） */
function bankPlay(){
  if (!S) return;
  const now = Date.now();
  if (typeof S.playMs !== "number") S.playMs = 0;
  S.playMs += Math.max(0, now - sessionStart);
  sessionStart = now;
}
function playTimeText(){
  const t = Math.floor((S && S.playMs ? S.playMs : 0) / 1000);
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  if (h > 0)  return h + " 小时 " + m + " 分";
  if (m > 0)  return m + " 分 " + s + " 秒";
  return s + " 秒";
}
function save(){
  if (!S || WIPED) return;
  bankPlay();
  S.lastSave = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function hardReset(){
  WIPED = true;
  stopTick();
  try{
    localStorage.removeItem(SAVE_KEY);
    // 顺手清掉可能残留的旧 key
    ["fanchen_xiuxian_v1","fanchen_xiuxian","xiuxian_save"].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  }catch(e){}
  S = null;
  try{ location.reload(); }catch(e){ location.href = location.href; }
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1) return null;
    return d;
  }catch(e){ return null; }
}

function settleOffline(){
  const elapsed = (Date.now() - (S.lastSave||Date.now()))/1000;
  if (elapsed < 60) return;
  const days = Math.min(elapsed / (TICK_MS/1000), OFFLINE_CAP_DAYS);
  const realDays = Math.floor(days * OFFLINE_RATE);
  if (realDays < 5) return;
  const beforeName = realmTitle(S.realm,S.layer);
  // 离线只结算修为与自然晋层，不推寿元
  for (let i=0;i<realDays;i++){
    if (S.exp < expNeed()) S.exp = Math.min(expNeed(), S.exp + gainPerDay());
    if (S.exp >= expNeed()){
      const rr = REALMS[S.realm];
      if (S.layer < rr.layers){
        S.layer++; S.exp = 0; S.hp = stats().hpMax;
      } else break;
    }
  }
  const afterName = realmTitle(S.realm,S.layer);
  setTimeout(()=>{
    const tail = afterName !== beforeName ? "，已自然晋入 "+afterName : "";
    pushLog("你从入定中醒来，窗外已过了些时日。（离线 "+realDays+" 日"+tail+"）", "sys");
    renderHeader();
  }, 400);
}

/* -------------------- 操作 -------------------- */
function actTrain(){
  if (!S || S.dead) return;
  if (S.task){ taskBlocked(); return; }
  refillTrain();
  if (S.med <= 0){
    flashModal("真元未复", "你连日打坐，经脉已经吃不消了。\n\n下一次打坐还要 "+trainCdText()+"。\n\n（每 2 分钟恢复一次，最多攒 "+TRAIN_BANK+" 次；突破新境界会立刻补满）");
    return;
  }
  const before = S.exp;
  const bonus = gainPerDay() * 30 * (TRAIN_EXP_MUL - 1);   // 海量经验
  S.med--;
  advanceDays(30, "train");
  S.exp += bonus;
  const g = S.exp - before;
  pushLog("你闭目内视，心神沉入气海。\n这一坐，抵得上常人 "+Math.round(30*TRAIN_EXP_MUL)+" 日苦修。修为 +"+fmt(g)+"。");
  save(); renderHeader(); renderTab();
  // 打坐后偶有悟道之机
  if (S.quizCd <= 0 && Math.random() < 0.45){
    setTimeout(()=>{ openQuiz(); }, 320);
  }
}

function actExplore(){
  if (!S || S.dead) return;
  if (S.task){ taskBlocked(); return; }
  const opened = REGIONS.map((r,i)=>({r,i})).filter(o=>canEnter(o.r));
  const choices = opened.map(o=>({
    t: o.r.n + "  (" + o.r.days[0] + "-" + o.r.days[1] + "日)",
    f: ()=> doExplore(o.i)
  }));
  choices.push({t:"算了，还是在家待着", f:null});
  openModal("去往何处", "你收拾好行囊，站在岔路口。", choices);
}

/* 直接找同阶对手打一场（肉鸽式回合） */
function actFight(){
  if (!S || S.dead) return;
  if (S.task){ taskBlocked(); return; }
  if (S.hurt > 0){
    flashModal("伤势未愈", "身上还带着伤，这样上场是送命。\n\n需静养 " + S.hurt + " 日。");
    return;
  }
  const r = REGIONS[S.region] || REGIONS[0];
  const opened = REGIONS.filter(canEnter);
  const hi = opened.length ? opened[opened.length-1] : REGIONS[0];
  const lv = clamp(hi.lv + (Math.random()<0.3 ? -1 : 0), 1, 7);
  const mob = makeMob(lv);
  openModal("寻对手", "你在" + hi.n + "一带放出神识，寻了个差不多的对手。\n\n" +
    mob.n + "（战力 " + fmt(mobPower(mob)) + "，你是 " + fmt(power()) + "）\n\n打不打？",
    [{t:"打", f:()=>{ setTimeout(()=>openFight(mob, null), 240); }},
     {t:"算了", f:null}]);
}

function canEnter(r){
  if (S.realm < r.r) return false;
  if (S.realm === r.r && S.layer < r.l) return false;
  return true;
}

function doExplore(idx){
  const r = REGIONS[idx];
  S.region = idx;
  S.stat.explored++;
  const days = RI(r.days[0], r.days[1]);
  advanceDays(days, "train");
  if (S.dead) return;
  renderHeader();

  const roll = Math.random();
  // 三分之一概率直接撞上对手 —— 走肉鸽式回合
  if (roll < 0.32){
    const mob = makeFoe(clamp(r.lv + (Math.random()<0.25?1:0), 1, 7));
    mob.n = pick(MOBS[mob.lv])[0];
    pushLog("你在"+r.n+"走了 "+days+" 日，林子里忽然窜出一只"+mob.n+"。");
    setTimeout(()=>{
      openFight(mob, (win)=>{
        if (!win) return;
        const e = Math.random() < 0.4 ? drawEvent() : null;
        if (e) setTimeout(()=>openModal(e.t, e.d, e.c), 300);
      });
    }, 280);
    return;
  }
  // 四分之一概率平淡收场，但总不至于空手
  if (roll < 0.55){
    const m = moneyGain(RI(55, 55 + r.lv*95));
    S.money += moneyGain(m);
    let extra = "";
    if (Math.random() < 0.65){
      const k = addItem(pick(["lingcao","shoupi","fuzhi","xueteng","yaogu"]), RI(1,3), rollQ(r.lv));
      extra = "另捡到 "+itemName(k)+"。";
    }
    pushLog("你在"+r.n+"走了 "+days+" 日，没遇上什么事。\n沿途捡了些能换钱的东西，灵石 +"+m+"。"+extra);
    renderHeader();
    return;
  }
  const e = drawEvent();
  // 事件延后到 modal 关闭后再开，避免叠加
  setTimeout(()=>{
    openModal(e.t, e.d, e.c);
  }, 260);
}

function actBreak(){
  if (!S || S.dead) return;
  if (S.task){ taskBlocked(); return; }
  const chk = canBreak();
  if (!chk.ok){
    flashModal("时机未到", chk.why + "\n\n可先去坊市或山里找找办法。");
    return;
  }
  const r = REALMS[S.realm];
  const isBig = S.layer >= r.layers;
  const rate = breakRate() * (isBig && !chk.hasDan ? 0.5 : 1);
  const nameNext = isBig ? (REALMS[S.realm+1] ? realmTitle(S.realm+1, 1) : "天门") : realmTitle(S.realm, S.layer+1);
  const warn = (isBig && !chk.hasDan)
    ? "\n\n「无丹硬冲」——没有" + (ITEMS[chk.needDan] ? ITEMS[chk.needDan].n : "丹药") + "相助，成功率只剩一半。\n败则修为倒退、伤及根本。"
    : "\n\n成则更进一步，败则修为倒退、伤及根本。";
  const opts = [{t:"冲！", f:()=>{ doBreak(); }}];
  if (isBig && !chk.hasDan && chk.needDan && DAN_QUEST[chk.needDan]){
    opts.unshift({t:"先去寻丹（推荐）", f:()=>{ startDanQuest(chk.needDan); }});
  }
  opts.push({t:"再等等", f:null});
  openModal("冲击"+nameNext,
    "你盘膝坐定，气沉丹田。\n经脉里的灵气开始冲撞关隘。\n\n成功率约 "+Math.round(rate*100)+"%"+
    (S.buff.pozhang?"（已备破障丹）":"") + warn,
    opts);
}

  if (eqAtk(k)) b.push("攻+"+eqAtk(k));

  if (eqHp(k))  b.push("血+"+eqHp(k));
  if (eqMp(k))  b.push("灵+"+eqMp(k));
  return b.join(" ");
}
function slotHtml(slot, label){
  const arr = (S.equip && S.equip[slot]) || [];
  if (!arr.length) return '<div class="slot"><div class="sn">'+label+' 0/'+EQUIP_STACK+'</div><div class="sv">—</div></div>';
  const sum = [];
  let atk=0, def=0, hp=0, mp=0;
  arr.forEach(k=>{ atk+=eqAtk(k); def+=eqDef(k); hp+=eqHp(k); mp+=eqMp(k); });
  if (atk) sum.push("攻+"+atk);
  if (def) sum.push("护+"+def);
  if (hp)  sum.push("血+"+hp);
  if (mp)  sum.push("灵+"+mp);
  return '<div class="slot has"><div class="sn">'+label+' '+arr.length+'/'+EQUIP_STACK+'</div>'
       + arr.map((k,i)=>'<div class="sv" onclick="unequip(\''+slot+'\','+i+')">'+itemBase(k).n+'</div>').join("")
       + '<div class="sx">'+sum.join(" ")+'</div></div>';
}

function qtag(k){
  const q = QQ(k);
  if (q <= 0) return "";
  const c = RARITY[q].c;
  return '<span class="tag" style="color:'+c+';border-color:'+c+'55;background:'+c+'12">'+RARITY[q].n+'</span>';
}

function renderBag(){
  const keys = Object.keys(S.bag).filter(k=>S.bag[k]>0 && itemBase(k));
  const mats  = keys.filter(k=>itemBase(k).t==="mat").sort((a,b)=>QQ(b)-QQ(a));
  const pills = keys.filter(k=>itemBase(k).t==="pill").sort((a,b)=>QQ(b)-QQ(a));
  const eqs   = keys.filter(k=>itemBase(k).t==="eq").sort((a,b)=>QQ(b)-QQ(a));

  let html = '';

  html += '<div class="card"><h3>材料</h3>';
  if (!mats.length) html += '<div class="empty">没有材料</div>';
  else mats.forEach(k=>{
    const it = itemBase(k);
    html += '<div class="row">'
      + '<div><div class="nm">'+it.n+' '+qtag(k)+' <span class="tag">×'+S.bag[k]+'</span></div>'
      + '<div class="ds">'+it.d+' · 单价 '+sellPrice(k)+'</div></div>'
      + '<div class="rt"><button class="btn sm" onclick="sellItem(\''+k+'\',1)">卖1</button>'
      + '<button class="btn sm" onclick="sellItem(\''+k+'\',999)">全卖</button></div>'
      + '</div>';
  });
  html += '</div>';

  html += '<div class="card"><h3>丹药</h3>';
  if (!pills.length) html += '<div class="empty">没有丹药</div>';
  else pills.forEach(k=>{
    const it = itemBase(k);
    const usable = it.use && QQ(k) >= 0;
    html += '<div class="row">'
      + '<div><div class="nm">'+it.n+' '+qtag(k)+' <span class="tag">×'+S.bag[k]+'</span></div>'
      + '<div class="ds">'+it.d+'</div></div>'
      + '<div class="rt">'+(usable?'<button class="btn sm" onclick="useItem(\''+k+'\')">服用</button>':'')
      + '<button class="btn sm" onclick="sellItem(\''+k+'\',1)">卖1</button></div>'
      + '</div>';
  });
  html += '</div>';

  const SLOT_NAME = {weapon:"法器", armor:"护身", trinket:"饰品"};
  html += '<div class="card"><h3>随身</h3><div class="slots">'
    + ["weapon","armor","trinket"].map(s=>slotHtml(s, SLOT_NAME[s])).join("")
    + '</div></div>';

  const eqLine = k=>{
    const b = [];
    if (eqAtk(k)) b.push("攻 +"+eqAtk(k));
    if (eqDef(k)) b.push("护 +"+eqDef(k));
    if (eqHp(k))  b.push("血 +"+eqHp(k));
    if (eqMp(k))  b.push("灵 +"+eqMp(k));
    return b.join(" · ");
  };
  // 与「换上后会被顶掉的那件」比较（槽满时顶最弱的）
  const cmp = k=>{
    const it = itemBase(k);
    const arr = S.equip[it.slot] || [];
    if (!arr.length) return "";
    const f = it.atk ? "atk" : (it.def ? "def" : (it.hp ? "hp" : "mp"));
    let worst = arr[0], wv = Infinity;
    arr.forEach(x=>{ const v = eqVal(x, f); if (v < wv){ wv = v; worst = x; } });
    const d = eqVal(k, f) - eqVal(worst, f);
    if (d === 0) return "";
    return ' <span class="tag '+(d>0?"eq":"")+'" style="'+(d>0?"":"color:var(--red);border-color:#E7B9A8;background:var(--red-l)")+'">'+(d>0?"↑":"↓")+Math.abs(d)+'</span>';
  };

  html += '<div class="card"><h3>法器 · 护身 · 饰品</h3>';
  if (!eqs.length) html += '<p class="hint">没有可佩之物。空手对敌，全凭肉身。</p>';
  else eqs.forEach(k=>{
    const it = itemBase(k);
    const arr = S.equip[it.slot] || [];
    const at = arr.indexOf(k);
    const on = at >= 0;
    const full = !on && arr.length >= EQUIP_STACK;
    html += '<div class="row">'
      + '<div><div class="nm">'+it.n+' '+qtag(k)+' <span class="tag">'+SLOT_NAME[it.slot]+'</span> '+(on?'<span class="tag on">已佩</span>':'')+'</div>'
      + '<div class="ds">'+it.d+' · '+eqLine(k)+(on?'':cmp(k))+'</div></div>'
      + '<div class="rt">'
      + '<button class="btn sm '+(full?'':'')+'" onclick="equipItem(\''+k+'\')">'+(on?'卸下':(full?'换上':'佩上'))+'</button>'
      + '<button class="btn sm" onclick="sellItem(\''+k+'\',1)">卖 '+sellPrice(k)+'</button></div>'
      + '</div>';
  });
  html += '</div>';

  $("tab-bag").innerHTML = html;
}

const QUEST_POOL = [
  ["lingcao", 5], ["yaodan", 3], ["shoupi", 6], ["xueteng", 4],
  ["yaogu", 4], ["fuzhi", 5], ["lingshi_ore", 3], ["lingyu", 1]
];

function ensureQuests(){
  if (!Array.isArray(S.quests)) S.quests = [];
  S.quests = S.quests.filter(q=>q && !q.done && ITEMS[q.item]);
  while (S.quests.length < 3){
    const p = pick(QUEST_POOL);
    if (S.quests.some(q=>q.item===p[0])) {
      if (S.quests.length >= QUEST_POOL.length) break;
      continue;
    }
    const n = Math.max(1, Math.round(p[1] * (1 + S.realm*0.6)));
    S.quests.push({ item:p[0], n:n, bonus:1.9 + S.realm*0.15, done:false });
  }
}

/* ============================================================
   天九赌坊 · 民间骰子斗牛
   五颗骰子，点数之和取个位：个位 0 为「牛牛」最大，其余即「牛几」。
   牛数相同比最大单颗，再同则比总点数，全同算和局。
   赌坊坐庄、灵石无限：你赢拿回两倍本金，输则赌注没收。
   ============================================================ */
const DICE_FACE = ["\u2680","\u2681","\u2682","\u2683","\u2684","\u2685"];
function rollDice(){ return [RI(1,6),RI(1,6),RI(1,6),RI(1,6),RI(1,6)]; }
function niuOf(d){
  const sum = d[0]+d[1]+d[2]+d[3]+d[4];
  const m = sum % 10;
  return {
    dice: d, sum: sum, max: Math.max.apply(null, d),
    n: m === 0 ? 10 : m,
    nm: m === 0 ? "牛牛" : ("牛" + m)
  };
}
function cmpNiu(a, b){
  if (a.n !== b.n) return a.n - b.n;
  if (a.max !== b.max) return a.max - b.max;
  return a.sum - b.sum;
}
function diceRow(niu, who){
  return '<div style="display:flex;align-items:center;gap:8px;margin:6px 0">'
    + '<span style="width:34px;color:var(--ink3);font-size:12px">' + who + '</span>'
    + '<span style="font-size:22px;letter-spacing:2px;line-height:1">' + niu.dice.map(v=>DICE_FACE[v-1]).join("") + '</span>'
    + '<span style="font-size:12px;color:var(--ink3)">共 ' + niu.sum + ' 点</span>'
    + '<b style="margin-left:auto;font-size:14px;color:' + (niu.n >= 8 ? "var(--amber)" : "var(--ink)") + '">' + niu.nm + '</b></div>';
}
function openGamble(){
  if (!S || S.dead) return;
  if (S.task){ taskBlocked(); return; }
  const m = Math.floor(S.money);
  if (m < 10){
    flashModal("囊中羞涩", "赌坊的伙计瞟了眼你的钱袋，连十颗灵石都凑不出。\n\n「改天再来吧。」");
    return;
  }
  const bets = [
    {p:0.10, t:"小赌"}, {p:0.30, t:"中赌"}, {p:0.60, t:"大赌"}, {p:1.00, t:"梭哈"}
  ];
  let h = '<p class="hint">五颗骰子，点数之和取个位。个位为零即「<b>牛牛</b>」，最大；其余便是牛几。'
        + '<br>牛数相同比最大单颗，再同比总点数，全同为和局。</p>'
        + '<p class="hint">一赔一：你赢，赌坊付你<b>两倍</b>本金；你输，赌注没收。'
        + '赌坊坐庄，灵石无限，永不封盘。</p>'
        + '<p style="margin-top:8px">你身上有 <b>' + fmt(m) + '</b> 灵石。</p><div class="qwrap">';
  const choices = bets.map(b=>{
    const v = Math.max(10, Math.floor(m * b.p));
    if (v > m) return null;
    h += '<div class="qopt static">' + b.t + ' — 押 <b>' + fmt(v) + '</b> 灵石</div>';
    return {t:b.t + "（押 " + fmt(v) + "）", f:()=>{ doGamble(v); return null; }};
  }).filter(Boolean);
  h += '</div>';
  openHtml("天九赌坊", h, choices.concat([{t:"算了，走人", f:null}]));
}
function doGamble(bet){
  if (S.money < bet){ flashModal("钱不够", "你翻遍口袋也凑不出这个数。"); return; }
  S.money -= bet;
  const mine = niuOf(rollDice());
  const his  = niuOf(rollDice());
  const cmp  = cmpNiu(mine, his);
  let title, tail, extra = "";

  if (cmp > 0){
    const win = bet * 2;                 // 一赔一：拿回两倍本金
    S.money += win;
    title = "你赢了";
    tail = "「" + mine.nm + "」压过「" + his.nm + "」，赌坊赔你两倍。\n\n灵石 +" + fmt(win) + "（净赚 " + fmt(bet) + "）。";
    // 大牌赢：额外送件装备
    if (mine.n >= 8 || Math.random() < 0.22){
      const lv = clamp(1 + Math.floor(S.realm*0.9), 1, 7);
      const k = rollEquip(lv);
      extra = "\n\n庄家脸色不太好，从桌下摸出一件东西推过来。\n\n得 " + itemName(k) + "。";
    }
    pushLog("赌坊：你掷出" + mine.nm + "，赢了庄家。灵石 +" + fmt(win) + "。", "good");
  } else if (cmp < 0){
    title = "你输了";
    tail = "「" + mine.nm + "」输给「" + his.nm + "」，赌注被收走。\n\n灵石 −" + fmt(bet) + "。";
    pushLog("赌坊：你掷出" + mine.nm + "，输给庄家的" + his.nm + "。灵石 −" + fmt(bet) + "。", "bad");
  } else {
    S.money += bet;
    title = "和局";
    tail = "两人点数分毫不差，伙计把灵石推了回来。\n\n不赔不赚。";
    pushLog("赌坊：和局，本金退回。", "dim");
  }
  const body = diceRow(mine, "你") + diceRow(his, "庄家")
    + '<p style="margin-top:10px;white-space:pre-wrap;line-height:1.85">' + escapeHtml(tail + extra) + '</p>'
    + '<p class="hint">你身上还剩 <b>' + fmt(Math.floor(S.money)) + '</b> 灵石。</p>';
  save(); renderHeader(); renderTab();
  openHtml(title, body, [{t:"再来一把", f:()=>{ openGamble(); }}, {t:"收手", f:null}]);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* -------------------- 交互函数（全局） -------------------- */
window.useItem = function(k){
  const it = itemBase(k);
  if (!it || !it.use || !S.bag[k]) return;
  const msg = it.use(S, QQ(k));
  removeItem(k,1);
  pushLog(msg, "good");
  save(); renderHeader(); renderBag();
};

window.sellItem = function(k, n){
  if (!S.bag[k]) return;
  const cnt = Math.min(S.bag[k], n);
  const gain = sellPrice(k) * cnt;
  const nm = itemName(k);
  removeItem(k, cnt);
  S.money += gain;
  pushLog("卖出 "+nm+" ×"+cnt+"，得灵石 "+gain+"。", "sys");
  save(); renderHeader();
  if (currentTab==="shop") renderShop(); else renderBag();
};

window.buyItem = function(k){
  const it = ITEMS[k];
  if (!it || S.money < it.price) return;
  S.money -= it.price;
  addItem(k, 1, 0);
  pushLog("买下 "+it.n+"，花去灵石 "+it.price+"。", "sys");
  save(); renderHeader(); renderShop();
};

window.buyMat = function(k){
  const it = ITEMS[k];
  if (!it || it.t !== "mat") return;
  const price = Math.round(it.price * 3);
  if (S.money < price) return;
  S.money -= price;
  addItem(k, 1, 0);
  pushLog("买下 "+it.n+" ×1，花去灵石 "+price+"。", "sys");
  save(); renderHeader(); renderShop();
};

window.deliverQuest = function(i){
  const q = S.quests && S.quests[i];
  if (!q || q.done) return;
  if (countOf(q.item) < q.n) return;
  let total = 0, left = q.n;
  const keys = Object.keys(S.bag).filter(k=>QID(k)===q.item).sort((a,b)=>QQ(a)-QQ(b));
  for (const k of keys){
    if (left <= 0) break;
    const take = Math.min(S.bag[k], left);
    total += sellPrice(k) * take;
    removeItem(k, take);
    left -= take;
  }
  const pay = Math.round(total * q.bonus * moneyK());
  S.money += pay;
  q.done = true;
  pushLog("交付 "+ITEMS[q.item].n+" ×"+q.n+"，得灵石 "+pay+"。", "good");
  ensureQuests();
  save(); renderHeader(); renderShop();
};

window.rerollQuests = function(){
  S.quests = [];
  ensureQuests();
  save(); renderShop();
};

window.buyGongfa = function(k){
  const g = GONGFA[k];
  if (S.money < g.price || S.known.includes(k)) return;
  S.money -= g.price;
  S.known.push(k);
  pushLog("你得了《"+g.n+"》的传承。", "good");
  save(); renderHeader(); renderShop();
};

const SLOT_CN = {weapon:"法器", armor:"护身", trinket:"饰品"};

window.equipItem = function(k){
  const it = itemBase(k);
  if (!it || !it.slot || !S.bag[k]) return;
  const arr = S.equip[it.slot] || (S.equip[it.slot] = []);
  const at = arr.indexOf(k);
  if (at >= 0){                       // 已穿戴 → 卸下
    arr.splice(at, 1);
    pushLog("你取下了" + itemName(k) + "。", "dim");
  } else {
    if (arr.length >= EQUIP_STACK){   // 满了 → 顶掉最弱的一件
      let worst = 0, wv = Infinity;
      arr.forEach((x,i)=>{ const v = eqAtk(x)+eqDef(x)+eqHp(x)+eqMp(x); if (v < wv){ wv = v; worst = i; } });
      const old = arr[worst];
      arr[worst] = k;
      pushLog("你换下了" + itemName(old) + "，佩上" + itemName(k) + "。", "dim");
    } else {
      arr.push(k);
      pushLog("你佩上了" + itemName(k) + "（" + SLOT_CN[it.slot] + " " + arr.length + "/" + EQUIP_STACK + "）。", "dim");
    }
  }
  renderHeader(); renderBag(); save();
};

window.unequip = function(slot, i){
  const arr = S.equip && S.equip[slot];
  if (!arr || !arr.length) return;
  const idx = (typeof i === "number") ? i : arr.length - 1;
  const k = arr[idx];
  if (!k) return;
  arr.splice(idx, 1);
  pushLog("你把" + itemName(k) + "取了下来。", "dim");
  renderHeader(); renderBag(); renderChar(); save();
};

window.switchGongfa = function(k){
  if (!S.known.includes(k)) return;
  S.gongfa = k;
  pushLog("你改修《"+GONGFA[k].n+"》。", "sys");
  renderChar(); save();
};

window.exportSave = function(){
  const str = btoa(encodeURIComponent(JSON.stringify(S)));
  const ta = document.createElement("textarea");
  ta.value = str;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  openModal("存档已导出", "一串存档码已复制到剪贴板。\n\n请粘贴到备忘录或聊天窗口里存好。\n换设备时用「导入」贴回来即可。\n\n长度："+str.length+" 字符", [{t:"好", f:null}]);
};

window.importSave = function(){
  const str = prompt("粘贴存档码：");
  if (!str) return;
  try{
    const d = JSON.parse(decodeURIComponent(atob(str.trim())));
    if (!d || d.v !== 1) throw new Error("bad");
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
    WIPED = true;                 // 阻止 beforeunload 把当前旧档写回去
    location.reload();
  }catch(e){
    openModal("读取失败", "存档码有误，或不是本游戏的存档。", [{t:"知道了", f:null}]);
  }
};

window.wipeSave = function(){
  openModal("重开一世", "当前进度将被彻底抹去，从取名字重新开始。\n\n这一下抹掉的是本机浏览器里的存档，抹了就没有了。\n真的要走这一步？", [
    {t:"抹去，重来", f:()=>{ hardReset(); }},
    {t:"算了", f:null}
  ]);
};

/* -------------------- 导航 -------------------- */
document.querySelectorAll("#nav div").forEach(el=>{
  el.onclick = ()=>{
    document.querySelectorAll("#nav div").forEach(x=>x.classList.remove("on"));
    el.classList.add("on");
    currentTab = el.dataset.go;
    document.querySelectorAll("[data-tab]").forEach(x=>{
      const tabs = x.dataset.tab.split(" ");
      x.classList.toggle("on", tabs.includes(currentTab));
    });
    $("acts").style.display = currentTab==="cult" ? "flex" : "none";
    renderTab();
  };
});

$("a-train").onclick = actTrain;
$("a-explore").onclick = actExplore;
$("a-fight").onclick = actFight;
$("a-break").onclick = actBreak;
$("mask").onclick = ()=>{ if (modalOpen) closeModal(); };

/* -------------------- 开局 -------------------- */
let rolledRoot = null;
let rerollLeft = 3;

function rollRoot(){
  const total = ROOTS.reduce((a,r)=>a+r.w,0);
  let r = Math.random()*total;
  for (const root of ROOTS){
    r -= root.w;
    if (r <= 0) return root;
  }
  return ROOTS[0];
}

function renderRootPick(){
  const box = $("s-root");
  box.innerHTML = `<div class="rn">${rolledRoot.n}</div>
    <div class="rd">${rolledRoot.d}</div>
    <div class="rb">修行速度 ×${rolledRoot.mul.toFixed(2)}</div>`;
  $("s-reroll").textContent = rerollLeft > 0 ? `换个灵根（剩 ${rerollLeft} 次）` : "灵根天定，改不了了";
  $("s-reroll").classList.toggle("off", rerollLeft <= 0);
}

function showStart(){
  rolledRoot = rollRoot();
  renderRootPick();
  $("s-reroll").onclick = ()=>{
    if (rerollLeft <= 0) return;
    rerollLeft--;
    rolledRoot = rollRoot();
    renderRootPick();
  };
  $("s-go").onclick = ()=>{
    const nm = ($("s-name").value || "").trim() || "无名";
    S = freshState(nm.slice(0,8), rolledRoot.n);
    S.log = [];
    S.hp = stats().hpMax;
    pushLog("你叫"+S.name+"，生于青石村，父母早亡。", "sys");
    pushLog("十六岁这年，你在后山捡到一本残破的功法。", "sys");
    pushLog("没人教你，你就自己照着练。", "sys");
    pushLog("这一练，就是一辈子。", "sys");
    save();
    $("start").classList.add("off");
    renderHeader();
    renderLog();
    startTick();
  };
}

/* -------------------- 存档迁移（老档补新字段） -------------------- */
function migrate(s){
  if (!s.equip || typeof s.equip !== "object") s.equip = {weapon:[], armor:[], trinket:[]};
  ["weapon","armor","trinket"].forEach(sl=>{
    const v = s.equip[sl];
    if (v === undefined || v === null) s.equip[sl] = [];
    else if (typeof v === "string") s.equip[sl] = [v];
    else if (!Array.isArray(v)) s.equip[sl] = [];
    s.equip[sl] = s.equip[sl].filter(x=>typeof x === "string");
    if (s.equip[sl].length > EQUIP_STACK) s.equip[sl] = s.equip[sl].slice(0, EQUIP_STACK);
  });
  if (s.med === undefined || s.med > TRAIN_BANK) s.med = TRAIN_BANK;
  if (typeof s.trainAt !== "number") s.trainAt = Date.now() + TRAIN_CD_MS;
  if (s.mp  === undefined) s.mp = 30;
  if (!Array.isArray(s.story)) s.story = [];
  if (s.pendingStory === undefined) s.pendingStory = null;
  if (s.quizCd === undefined) s.quizCd = 0;
  if (typeof s.playMs !== "number") s.playMs = 0;
  if (!s.born) s.born = Date.now();
  if (s.quizRight === undefined) s.quizRight = 0;
  if (s.quizWrong === undefined) s.quizWrong = 0;
  if (s.sideCd === undefined) s.sideCd = 0;
  if (!s.task) s.task = null;
  if (!s.side && s.sideCd === undefined) s.side = null;
  return s;
}

/* -------------------- 启动 -------------------- */
(function boot(){
  const saved = load();
  if (saved && !saved.dead){
    S = migrate(saved);
    $("start").classList.add("off");
    renderHeader();
    renderLog();
    settleOffline();
    startTick();
    pushLog("（存档已读取）", "dim");
  } else if (saved && saved.ascended){
    S = migrate(saved);
    $("start").classList.add("off");
    renderHeader();
    renderLog();
    setTimeout(()=>showAscend(), 400);
  } else {
    showStart();
  }
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", ()=>{
    if (document.hidden) save();
    else { sessionStart = Date.now(); if (S && !S.dead){ settleOffline(); renderHeader(); } }
  });
  setInterval(save, 5000);
})();
</script>
